name: Build obsidian plugin

on:
    push:
        tags:
            - "*"

permissions:
    id-token: write
    contents: write
    attestations: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: latest
            - name: Build
              id: build
              run: |
                  pnpm install --frozen-lockfile
                  pnpm run build
            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css
            - name: Create Release
              id: create_release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.ref }}
                  name: ${{ github.ref_name }}
                  generate_release_notes: false
                  body: Release ${{ github.ref_name }} of Git Subbridge.
                  draft: false
                  prerelease: false
                  files: |
                      main.js
                      manifest.json
                      styles.css
